name: Weekly AI Briefing

on:
  schedule:
    # Every Monday at 8:00 AM UTC (adjust if you want a different timezone)
    - cron: "0 13 * * 1"   # 13:00 UTC = 8:00 AM US Eastern / 6:00 AM Mountain
  workflow_dispatch:        # Also lets you trigger it manually from GitHub

jobs:
  post-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing generator
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          WP_SITE_URL:       ${{ secrets.WP_SITE_URL }}
          WP_USERNAME:       ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:   ${{ secrets.WP_APP_PASSWORD }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
        run: python3 generate_ai_hub_briefing.py --post --fresh

      - name: Generate Instagram posts
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS:       ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 generate_instagram_posts.py --post
